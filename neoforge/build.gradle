plugins {
    id "net.neoforged.moddev" version "${mod_dev_gradle_version}"
}

base {
    archivesName = "can-pipe-neoforge-"+minecraft_version
}

repositories {
    maven {
        name= "RogueLogix"
        url = "https://maven.logix.dev/snapshots"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = uri("https://api.modrinth.com/maven")
            }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
}

compileJava.source project(":common").sourceSets.main.allSource

dependencies {
    jarJar implementation("blue.endless:jankson:1.2.3")

    implementation "maven.modrinth:rrtt217-s-hdr-mod:3.1.1-26.2+neoforge"
    implementation "maven.modrinth:cloth-config:26.2.155+neoforge"
    implementation "maven.modrinth:modmenu:20.0.1"
}

neoForge {
    version = neoforge_current_version
    accessTransformers.from(file("src/main/resources/META-INF/accesstransformer.cfg"))

    runs {
        clientGl {
            client()
            ideName = "NeoForge GL"
            gameDirectory = new File(project.rootDir, "/run")
            systemProperty("mixin.debug", "true")
            programArgument("--graphicsBackend=opengl")
        }
        clientVk {
            client()
            ideName = "NeoForge VK"
            gameDirectory = new File(project.rootDir, "/run")
            systemProperty("mixin.debug", "true")
            programArgument("--graphicsBackend=vulkan")
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    from project(":common").sourceSets.main.resources

    var expandProps = [
        'version'                         : version,
        'group'                           : project.group,
        'minecraft_version'               : minecraft_version,
        'neoforge_minecraft_version_range': neoforge_minecraft_version_range,
        'mod_name'                        : mod_name,
        'mod_author'                      : mod_author,
        'mod_id'                          : mod_id,
        'license'                         : license,
        'description'                     : project.description,
        'neoforge_current_version'        : neoforge_current_version,
        'neoforge_minimal_version'        : neoforge_minimal_version,
        'neoforge_loader_version_range'   : neoforge_loader_version_range,
        'credits'                         : credits,
        'java_version'                    : java_version
    ]

    filesMatching(["META-INF/neoforge.mods.toml", "*.mixins.json"]) {
        expand expandProps
    }
    inputs.properties(expandProps)
}