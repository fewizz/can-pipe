modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile="assets/${mod_id}/icon.png"
credits="${credits}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.mixins.01_texture_formats.json"

[[mixins]]
config = "${mod_id}.mixins.02_texture_targets.json"

[[mixins]]
config = "${mod_id}.mixins.03_core.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type="required"
versionRange = "[${neoforge_minimal_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${neoforge_minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
