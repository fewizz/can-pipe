plugins {
    id "fabric-loom" version "${fabric_loom_version}"
}

loom {
    accessWidenerPath = new File(rootDir, "fabric/src/main/resources/canpipe.accesswidener")
    runs {}
}

repositories {
    mavenLocal()
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    compileOnly "blue.endless:jankson:1.2.3"

    compileOnly "org.lwjgl:lwjgl-vulkan:3.3.3"  // For Cinnabar
    compileOnly "graphics.cinnabar:cinnabar-fabric:0.0.7-beta-16-gbadbe65-local"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}